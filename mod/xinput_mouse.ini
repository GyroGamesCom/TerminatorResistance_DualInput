; xinput_mouse.ini - dual input proxy for Terminator: Resistance
; Gyro (Steam Input "As Mouse") stays a native, linear mouse. When the right stick is
; pushed, the mouse look is suppressed so the stick has priority.
[Mouse]
; 1 = mod active, 0 = pure pass-through. The ToggleKey switches this at runtime.
Enabled=1
; XInput user index whose right stick has priority (-1 = any connected pad)
PadIndex=-1
; right stick (trackpad) magnitude above this fraction of full range (0..1) discards mouse look
StickOverrideDeadzone=0.20
; keep discarding mouse look this many ms after the stick returns under the threshold
; (stops gyro from jumping in during stick return)
StickReleaseMs=80
; multiplier on mouse/gyro deltas that are let through (1.0 = unchanged; fractions are accumulated, nothing is lost)
GyroSensitivity=1.0
; 1 = invert the axis of the passed-through mouse movement
InvertX=0
InvertY=0
; virtual-key code (hex or decimal) that toggles the mod while the game window is focused. 0x79 = F10, 0 = none
ToggleKey=0x79
; 0 = no log, 1 = init info only, 2 = also once-per-second statistics (written to mixed_input.log next to the DLL)
Log=1
; 1 = apply the exe patches (keep gamepad glyphs while the mouse moves, gamepad look curve only while the stick is used). 0 = skip all patches (troubleshooting)
Patches=1
; 1 = set the game's "using controller" state to gamepad once at start (needs Patches=1)
ForceGamepadAtStart=1
; right stick axis (|RX| or |RY|, fraction of full range 0..1) above which the game's gamepad look curve is enabled; just under the game's 0.25 deadzone
PadCurveThreshold=0.24
